<style>
/* Layout: header, 16:9 stage (1920 × 1080 frame), control rows, timing table */
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:var(--hx-max);margin:28px auto 0;display:grid;gap:20px}
.wrap>*{min-width:0}
.stage{border-radius:var(--hx-r2);overflow:hidden;line-height:0;background:var(--hx-soft);border:1px solid var(--hx-line)}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.ctl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px 16px;align-items:center}
.lab{font-size:var(--fs-small);color:var(--hx-muted)}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.sect{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid var(--hx-line)}
.sect:first-child{border-top:0;padding-top:0}
.sect .hx-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--hx-accent);color:#fff;font:700 var(--fs-small)/1 var(--hx-font)}
.grp .sep{width:1px;height:22px;background:var(--hx-line);margin:0 4px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block;flex:none}
.loop{display:inline-flex;gap:7px;align-items:center;font-size:var(--fs-small);cursor:pointer}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:var(--fs-small)}
caption{text-align:left;padding-bottom:8px}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--hx-line);vertical-align:top;font-variant-numeric:tabular-nums}
th{color:var(--hx-muted);font-weight:400;font-size:var(--fs-small)}
.note{color:var(--hx-muted);font-size:var(--fs-small);margin:0;max-width:90ch}
@media (max-width:560px){.ctl{grid-template-columns:minmax(0,1fr);gap:6px}.lab{margin-top:8px}}
</style>
<style>
/* wide workspace: stage left, controls right */
html.hx-wide body{height:100vh;overflow:hidden}
html.hx-wide .wrap{max-width:none;height:100%;margin:0;padding-block:0;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-items:start;gap:12px 24px}
html.hx-wide .wrap>header,html.hx-wide .hx-steps{grid-column:1/-1}
html.hx-wide .hx-steps,html.hx-wide .tw,html.hx-wide .note{display:none!important}
html.hx-wide .ctl{overflow:auto;max-height:100%;grid-template-columns:90px minmax(0,1fr)}
</style>
</head>

  });
  typeEl=document.createElementNS(NS,'g');
  D.type.forEach(([role,d])=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill',role==='a'?sc.a:sc.m);typeEl.appendChild(p)});
  logoG.appendChild(typeEl);
  const marksEnd=Math.max(...mods.map(m=>m.start+m.dur));
  total=Math.max(marksEnd,CFG.typeDelay+CFG.typeDur);
  table(marksEnd);
}
const ease=p=>1-Math.pow(1-p,3);
function frame(now){
  const sc=scheme(),cm=hex2(sc.m),ca=hex2(sc.a),dark=[0,0,0];
  let t=(now-t0)*S.rate;
  const loop=$('loop').checked,cycle=total+CFG.hold+CFG.out;
  if(loop&&t>cycle){t0=now;t=0}
  if(!loop&&t>total)t=total;
  apply(t,loop);
  raf=requestAnimationFrame(frame);
}
function apply(t,loop){
  const sc=scheme(),cm=hex2(sc.m),ca=hex2(sc.a),dark=[0,0,0];
  for(const m of mods){
    const p=ease(Math.min(1,Math.max(0,(t-m.start)/m.dur)));
    const c=Math.cos(Math.PI*(1-p)),s=Math.abs(c)<.002?.002:c;
    m.g.setAttribute('transform',`translate(${m.cx} 0) scale(${s.toFixed(4)} 1) translate(${-m.cx} 0)`);
    m.g.style.opacity=p>0?1:0;
    const shade=1-Math.abs(c);
    for(const el of m.paths){const base=el.dataset.role==='a'?ca:cm;el.setAttribute('fill',css(mix(base,dark,.4*shade)))}
  }
  const tp=Math.min(1,Math.max(0,(t-CFG.typeDelay)/CFG.typeDur));
  let all=1;
  if(loop&&t>total+CFG.hold)all=1-Math.min(1,(t-total-CFG.hold)/CFG.out);
  typeEl.style.opacity=tp;logoG.style.opacity=all;
}
function play(){cancelAnimationFrame(raf);t0=performance.now();raf=requestAnimationFrame(frame)}
function still(){cancelAnimationFrame(raf);t0=performance.now()-total/S.rate-1;$('loop').checked=false;raf=requestAnimationFrame(frame)}

/* controls */
function btn(host,label,on,fn,color){
  const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(on));
  if(color){const d=document.createElement('i');d.className='dot';d.style.background=color;b.appendChild(d)}
  b.appendChild(document.createTextNode(label));b.addEventListener('click',fn);host.appendChild(b);return b;
}
const T=(en,ko)=>L==='ko'?ko:en;
function sw(host,color,name,on,fn){const b=document.createElement('button');b.type='button';b.className='hx-sw';b.style.setProperty('--c',color);b.title=name;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(on));b.addEventListener('click',fn);host.appendChild(b)}
function cap(host,t){const e=document.createElement('span');e.className='swn';e.textContent=t;host.appendChild(e)}
function chip(host,bg,tx,pt,name,on,fn){const b=document.createElement('button');b.type='button';b.className='hx-chip';b.style.cssText=`--b:${bg};--t:${tx};--p:${pt}`;b.title=name;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(on));b.innerHTML='Aa<i></i>';b.addEventListener('click',fn);host.appendChild(b)}
function cgroup(host,label){const g=document.createElement('div');g.className='hx-cg';const l=document.createElement('b');l.textContent=label;const c=document.createElement('div');c.className='hx-chips';g.append(l,c);host.appendChild(g);return c}
function controls(){
  $('gVer').textContent='';VERS.forEach(v=>btn($('gVer'),T(v[1],v[2]),S.ver===v[0],()=>{S.ver=v[0];redo()}));
  const B=$('gBg');B.textContent='';
  if(S.ver.startsWith('full')){
    const g=cgroup(B,'UNIST');
    chip(g,WHITE,NAVY,NAVY,T('White · UNIST Navy','흰 배경 · UNIST Navy'),S.full==='white',()=>{S.full='white';redo()});
    chip(g,NAVY,WHITE,WHITE,T('UNIST Navy · white','UNIST Navy 배경 · 흰색'),S.full==='navy',()=>{S.full='navy';redo()});
  }else{
    const set=(bg,a)=>()=>{S.bg=bg;S.aux=a;redo()};
    const g1=cgroup(B,T('White','흰색')),g2=cgroup(B,T('Purple','보라')),g3=cgroup(B,T('Color','컬러'));
    AUX.forEach(a=>{
      chip(g1,WHITE,PURPLE,a[1],`${T(a[2],a[3])}`,S.bg==='white'&&S.aux===a[0],set('white',a[0]));
      chip(g2,PURPLE,WHITE,a[1],`${T(a[2],a[3])}`,S.bg==='purple'&&S.aux===a[0],set('purple',a[0]));
      chip(g3,a[1],PURPLE,CACC[a[0]],`${T(a[2],a[3])}`,S.bg==='aux'&&S.aux===a[0],set('aux',a[0]));
    });
  }
  $('gOrd').textContent='';ORDS.forEach(o=>btn($('gOrd'),T(o[1],o[2]),S.ord===o[0],()=>{S.ord=o[0];redo()}));
  $('gRate').textContent='';RATES.forEach(r=>btn($('gRate'),r+'×',S.rate===r,()=>{S.rate=r;controls();play()}));
  try{localStorage.setItem('hcdt-motion',JSON.stringify(S))}catch(e){}
}
function redo(){controls();build();play()}
function table(marksEnd){
  const n=mods.length,ord=ORDS.find(o=>o[0]===S.ord),ver=VERS.find(v=>v[0]===S.ver);
  const rows=[
    [T(`${ver[1]} · ${n} modules`,`${ver[2]} · 모듈 ${n}개`),T(`0–${CFG.sweep+CFG.jitter} ms, in order`,`0–${CFG.sweep+CFG.jitter} ms, 순서대로`),T(`${CFG.durMin}–${CFG.durMax} ms (smaller is faster)`,`${CFG.durMin}–${CFG.durMax} ms (작을수록 빠름)`),T(`Flips in horizontally · ${ord[1]}`,`좌우로 뒤집히며 등장 · ${ord[2]}`)],
    [T('Wordmark','워드마크'),`${CFG.typeDelay} ms`,`${CFG.typeDur} ms`,T('Opacity 0% → 100%','투명도 0% → 100%')],
    [T('Fully in','전체 등장 완료'),`${Math.round(Math.max(marksEnd,CFG.typeDelay+CFG.typeDur))} ms`,'',T(`Holds ${CFG.hold} ms`,`${CFG.hold} ms 유지`)],
    [T('Exit when looping','반복 시 퇴장'),'',`${CFG.out} ms`,T('Whole logo 100% → 0%, then restart','로고 전체 100% → 0% 후 처음부터')]
  ];
  const tb=$('rows');tb.textContent='';
  rows.forEach(r=>{const tr=document.createElement('tr');r.forEach(c=>{const td=document.createElement('td');td.textContent=c;tr.appendChild(td)});tb.appendChild(tr)});
}
$('replay').addEventListener('click',()=>{play()});
/* ---------- export: WebM (real-time capture of deterministic frames), PNG / SVG of the final frame ---------- */
function svgString(){const c=$('stage').cloneNode(true);c.setAttribute('xmlns','http://www.w3.org/2000/svg');c.setAttribute('width','1920');c.setAttribute('height','1080');c.removeAttribute('role');c.removeAttribute('aria-label');return new XMLSerializer().serializeToString(c)}
function toImg(str){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str)})}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function finalFrame(){cancelAnimationFrame(raf);apply(total,false)}
function resume(){S.rate=S.rate;play()}
$('exSvg').addEventListener('click',()=>{finalFrame();save(new Blob([svgString()],{type:'image/svg+xml'}),'hcdt-logo-motion-final.svg');resume()});
$('exPng').addEventListener('click',async()=>{finalFrame();const img=await toImg(svgString());const c=document.createElement('canvas');c.width=1920;c.height=1080;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{save(b,'hcdt-logo-motion-final.png');resume()},'image/png')});
async function exportWebm(b){
  b=b||$('exWebm');
  if(!window.MediaRecorder){b.textContent='WebM not supported in this browser';return}
  cancelAnimationFrame(raf);const old=b.textContent;
  const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d');
  const stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',videoBitsPerSecond:12e6}),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);rec.start();
  const dur=total+CFG.hold,fps=30,n=Math.ceil(dur/1000*fps);
  for(let i=0;i<=n;i++){
    const t0f=performance.now();
    apply(Math.min(dur,i*1000/fps),false);
    x.drawImage(await toImg(svgString()),0,0);
    const tr=stream.getVideoTracks()[0];if(tr.requestFrame)tr.requestFrame();
    b.textContent='Recording '+Math.round(i/n*100)+'%';
    const wait=1000/fps-(performance.now()-t0f);if(wait>0)await new Promise(r=>setTimeout(r,wait));
  }
  rec.stop();await done;
  save(new Blob(chunks,{type:'video/webm'}),'hcdt-logo-motion.webm');
  b.textContent=old;play();
}
$('exWebm').addEventListener('click',()=>exportWebm($('exWebm')));
$('dlVideo').addEventListener('click',()=>exportWebm($('dlVideo')));
$('loop').addEventListener('change',()=>{if($('loop').checked)play()});
window.HXApply=function(l){
  L=l;document.querySelectorAll('[data-en]').forEach(e=>{if(!e.closest('[data-hx]'))e.textContent=e.getAttribute('data-'+l)});
  $('stage').setAttribute('aria-label',T('HCDT logo motion','HCDT 로고 모션'));
  document.title=T('HCDT Logo Motion','HCDT 로고 모션');
  controls();if(mods.length)table(Math.max(...mods.map(m=>m.start+m.dur)));
};
try{L=localStorage.getItem('hcdt-lang')==='ko'?'ko':'en'}catch(e){}
window.HXApply(L);build();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)still();else play();
</script>
