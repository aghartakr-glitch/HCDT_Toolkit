<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HCDT Toolkit</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: shared bar · intro · six tool rows (live preview · name and purpose · open) · spec table.
   Type follows hcdt-ui.css: 20 / 14 / 13 / 12 / 11. Previews move on hover or keyboard focus. */
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{font:400 var(--fs-body)/1.5 var(--hx-font);font-variant-numeric:tabular-nums}
.wrap{max-width:var(--hx-max);margin:0 auto;padding-block:40px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
.wrap>*{min-width:0}
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-bottom:24px;border-bottom:1px solid var(--hx-fg)}
.intro h1{margin:0;font:var(--w-h1) var(--fs-h1)/1.1 var(--hx-font);letter-spacing:-.01em}
.intro p{margin:12px 0 0;font:400 var(--fs-body)/1.5 var(--hx-font);color:var(--hx-muted);max-width:60ch}
.intro dl{margin:0;display:grid;grid-template-columns:auto auto;gap:4px 16px;font:var(--hx-t4)}
.intro dt{color:var(--hx-muted)}.intro dd{margin:0;text-align:right}
@media (max-width:640px){.intro{grid-template-columns:minmax(0,1fr)}.intro dd{text-align:left}}

.eyebrow{margin:0 0 12px;font:var(--hx-t5);letter-spacing:.06em;text-transform:uppercase;color:var(--hx-muted)}
.tools{list-style:none;margin:0;padding:0;display:grid}
.tools li{border-top:1px solid var(--hx-line)}
.tools li:last-child{border-bottom:1px solid var(--hx-line)}
.tool{display:grid;grid-template-columns:320px minmax(0,1fr) auto;gap:32px;align-items:center;padding:24px 0;color:inherit;text-decoration:none}
.tool:focus-visible{outline:2px solid var(--hx-accent);outline-offset:4px;border-radius:var(--hx-r2)}
.txt{display:grid;gap:8px;min-width:0}
.txt .k{font:var(--hx-t5);letter-spacing:.06em;color:var(--hx-muted)}
.txt h2{margin:0;font:var(--w-h3) var(--fs-h3)/1.2 var(--hx-font);letter-spacing:-.01em}
.txt p{margin:0;font:400 var(--fs-body)/1.5 var(--hx-font);color:var(--hx-muted);max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{font:var(--hx-t4);border:1px solid var(--hx-line);border-radius:999px;padding:3px 10px}
.go{display:inline-flex;align-items:center;gap:8px;font:700 var(--fs-small)/1 var(--hx-font);color:var(--hx-accent);white-space:nowrap;padding:10px 14px;border:1px solid var(--hx-accent);border-radius:var(--hx-r)}
.go svg{width:14px;height:14px}
.tool:hover .go,.tool:focus-visible .go{background:var(--hx-accent);color:var(--hx-accent-fg)}
.tool:hover h2{color:var(--hx-accent)}

/* live previews */
.pic{position:relative;aspect-ratio:320/216;max-width:100%;background:var(--hx-soft);border-radius:var(--hx-r2);overflow:hidden;isolation:isolate}
.pic .cap{position:absolute;left:10px;bottom:10px;z-index:5;font:var(--hx-t4);background:var(--hx-bg);border:1px solid var(--hx-line);border-radius:999px;padding:2px 9px;opacity:0;transition:opacity .2s}
.tool:hover .cap,.tool:focus-visible .cap{opacity:1}
.pic svg.full{position:absolute;inset:0;width:100%;height:100%}
.pic img{position:absolute;display:block;max-width:none}
/* motion */
.p-motion .mod{transform-box:fill-box;transform-origin:50% 50%}
.p-motion svg{--aux:#64D8D8}
.p-motion .a{fill:var(--aux);transition:fill .35s}
.p-motion .bar{fill:var(--hx-accent)}
/* name card: back slides out, fronts change */
.p-card .cd{width:62%;left:9%;top:16%;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(20,10,40,.12);transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .35s}
.p-card .back{transform:translate(18%,22%) rotate(0deg);opacity:0}
.p-card .back:first-of-type{opacity:1}
.p-card .front{z-index:2;transform:rotate(-3deg)}
.p-card .front+.front{opacity:0}
.tool:hover .p-card .back,.tool:focus-visible .p-card .back{transform:translate(42%,40%) rotate(4deg)}
.tool:hover .p-card .front,.tool:focus-visible .p-card .front{transform:translate(-4%,-6%) rotate(-6deg)}
/* poster: templates and color combinations in turn */
.p-poster img{height:86%;top:7%;left:50%;transform:translateX(-50%);box-shadow:0 1px 2px rgba(0,0,0,.1),0 8px 24px rgba(20,10,40,.12);opacity:0;transition:opacity .3s}
.p-poster img.on{opacity:1}
/* letter: pages fan out and the grid appears */
.p-slides img{width:84%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 1px 2px rgba(0,0,0,.1),0 8px 24px rgba(20,10,40,.12);opacity:0;transition:opacity .3s}
.p-slides img.on{opacity:1}
.p-letter img{height:86%;top:7%;left:50%;box-shadow:0 1px 2px rgba(0,0,0,.1),0 8px 24px rgba(20,10,40,.1);transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .35s}
.p-letter .l1,.p-letter .lg{transform:translateX(-50%);z-index:3}
.p-letter .lg{opacity:0;z-index:4}
.p-letter .l2{transform:translateX(-50%);z-index:2}
.p-letter .l3{transform:translateX(-50%);z-index:1}
.tool:hover .p-letter .lg,.tool:focus-visible .p-letter .lg{opacity:1}
.tool:hover .p-letter .l1,.tool:hover .p-letter .lg,.tool:focus-visible .p-letter .l1,.tool:focus-visible .p-letter .lg{transform:translateX(-95%)}
.tool:hover .p-letter .l2,.tool:focus-visible .p-letter .l2{transform:translateX(-45%) rotate(2deg)}
.tool:hover .p-letter .l3,.tool:focus-visible .p-letter .l3{transform:translateX(5%) rotate(4deg)}
@media (prefers-reduced-motion:reduce){.pic *{transition:none!important}}

@media (max-width:860px){
  .tool{grid-template-columns:minmax(0,1fr);gap:16px}
  .pic{max-width:420px}
  .go{justify-self:start}
}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font:var(--hx-t3)}
th,td{text-align:left;padding:10px 16px 10px 0;border-bottom:1px solid var(--hx-line);vertical-align:top}
th{font:var(--hx-t4);color:var(--hx-muted);border-bottom-color:var(--hx-fg)}
td b{font-weight:700}
.foot{font:var(--hx-t4);color:var(--hx-muted);margin:0}
</style>
</head>

        <tr><td><b data-en="Slides" data-ko="PPT 생성기"></b></td><td data-en="16:9 · 1920 × 1080 · 8 col × 10 rows" data-ko="16:9 · 1920 × 1080 · 8단 × 10행"></td><td>PPTX · PDF · PNG · JSON</td><td data-en="Guide 261028, section 10 · InDesign HCDT_PPT" data-ko="가이드 261028, 10항 · InDesign HCDT_PPT"></td></tr>
        <tr><td><b data-en="Poster" data-ko="포스터 생성기"></b></td><td data-en="A4 · margin 14 mm · 4 col × 14 rows · gutter 4 mm" data-ko="A4 · 여백 14 mm · 4단 × 14행 · 간격 4 mm"></td><td>PDF 300 dpi · PNG · JSON</td><td data-en="Guide 261028, section 10 · InDesign poster" data-ko="가이드 261028, 10항 · InDesign 포스터"></td></tr>
        <tr><td><b data-en="Logo Motion" data-ko="로고 모션"></b></td><td>1920 × 1080 · 16:9</td><td data-en="Screen recording" data-ko="화면 녹화"></td><td data-en="Guide 261028, sections 1–4" data-ko="가이드 261028, 1–4항"></td></tr>
      </tbody>
    </table></div>
  </section>

  <p class="foot" data-en="The language you pick here carries over to every tool." data-ko="여기서 고른 언어는 모든 도구에 똑같이 적용."></p>
</div>

<script>
const AUX=[['#64D8D8','Verdigris','베르디그리'],['#E8B9AA','Terracotta','테라코타'],['#73D888','Fluoxetine','플루옥세틴'],['#E8E041','Asparagus Soup','아스파라거스 수프']];
const CARDS=[['Full logo','풀 로고'],['Trapezoid','사다리꼴'],['+ –','+ –'],['Color scheme','배색 로고']];
const SLIDES=[['Cover','표지'],['Contents','목차'],['Quote','인용'],['Body','본문'],['Purple theme · cover','보라 테마 · 표지'],['Purple theme · body','보라 테마 · 본문']];
const POSTERS=[...[1,2,3,4,5,6].map(n=>['Template '+n,'템플릿 '+n]),['Combination A','배색 A'],['Combination C','배색 C'],['Combination D','배색 D'],['Combination E','배색 E']];
let L='en';
const T=(a)=>L==='ko'?a[1]:a[0];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* one controller per preview: start on hover or focus, reset on leave */
const ANIM={
  motion(pic){
    const mods=[...pic.querySelectorAll('.mod')],type=pic.querySelector('.type'),bar=pic.querySelector('.bar'),cap=pic.querySelector('.cap'),svg=pic.querySelector('svg');let anims=[],tm,k=0;
    const aux=()=>{svg.style.setProperty('--aux',AUX[k][0]);cap.textContent=T(['General Use','일반용'])+' · '+T(AUX[k].slice(1))};
    const xs=mods.map(m=>+m.dataset.x),x0=Math.min(...xs),x1=Math.max(...xs);
    function run(){
      aux();k=(k+1)%4;
      anims.forEach(a=>a.cancel());anims=[];
      mods.forEach((m,i)=>{const d=(xs[i]-x0)/(x1-x0||1)*700+((i*37)%90);
        anims.push(m.animate([{transform:'scaleX(-1)',opacity:0,offset:0},{transform:'scaleX(-1)',opacity:1,offset:.01},{transform:'scaleX(0.02)',opacity:1,offset:.5},{transform:'scaleX(1)',opacity:1}],{duration:700,delay:d,easing:'cubic-bezier(.3,.6,.3,1)',fill:'both'}))});
      anims.push(type.animate([{opacity:0},{opacity:1}],{duration:700,delay:900,fill:'both'}));
      anims.push(bar.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:2400,fill:'both'}));
    }
    return {start(){k=0;run();tm=setInterval(run,2900)},stop(){clearInterval(tm);anims.forEach(a=>a.cancel());anims=[];k=0;svg.style.setProperty('--aux',AUX[0][0])},label(){k=0;aux()}};
  },
  card(pic){
    const fr=[...pic.querySelectorAll('.front')],bk=[...pic.querySelectorAll('.back')],cap=pic.querySelector('.cap');let i=0,tm;
    const show=()=>{fr.forEach((f,j)=>f.style.opacity=j===i?1:0);bk.forEach((f,j)=>f.style.opacity=j===i%bk.length?1:0);cap.textContent=T(['Version','버전'])+' · '+T(CARDS[i])};
    return {start(){i=0;show();tm=setInterval(()=>{i=(i+1)%fr.length;show()},900)},stop(){clearInterval(tm);i=0;fr.forEach((f,j)=>f.style.opacity=j?0:1);bk.forEach((f,j)=>f.style.opacity=j?0:1)},label(){show()}};
  },
  poster(pic){
    const im=[...pic.querySelectorAll('img')],cap=pic.querySelector('.cap');let i=0,tm;
    const show=()=>{im.forEach((f,j)=>f.classList.toggle('on',j===i));cap.textContent=T(POSTERS[i])};
    return {start(){i=0;show();tm=setInterval(()=>{i=(i+1)%im.length;show()},650)},stop(){clearInterval(tm);i=0;im.forEach((f,j)=>f.classList.toggle('on',!j))},label(){show()}};
  },
  slides(pic){
    const im=[...pic.querySelectorAll('img')],cap=pic.querySelector('.cap');let i=0,tm;
    const show=()=>{im.forEach((f,j)=>f.classList.toggle('on',j===i));cap.textContent=T(SLIDES[i])};
    return {start(){i=0;show();tm=setInterval(()=>{i=(i+1)%im.length;show()},800)},stop(){clearInterval(tm);i=0;im.forEach((f,j)=>f.classList.toggle('on',!j))},label(){show()}};
  },
  letter(pic){
    const cap=pic.querySelector('.cap');
    return {start(){},stop(){},label(){cap.textContent=T(['3 pages · grid shown','3쪽 · 그리드 표시'])}};
  }
};
document.querySelectorAll('.tool').forEach(a=>{
  const c=ANIM[a.dataset.anim](a.querySelector('.pic'));a._c=c;
  const on=()=>{if(!reduce){c.label();c.start()}else c.label()},off=()=>c.stop();
  a.addEventListener('mouseenter',on);a.addEventListener('mouseleave',off);
  a.addEventListener('focus',on);a.addEventListener('blur',off);
});
window.HXApply=function(l){
  L=l;
  document.querySelectorAll('[data-en]').forEach(e=>{if(!e.closest('[data-hx]'))e.textContent=e.getAttribute('data-'+l)});
  document.title=l==='ko'?'HCDT 툴킷':'HCDT Toolkit';
  document.querySelectorAll('.tool').forEach(a=>a._c&&a._c.label());
};
</script>
<script src="hcdt-ui.js?v=20261029i" data-tool="home"></script>
</body>
